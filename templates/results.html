<h2>All Registered Users</h2>
<table border="1">
  <tr>
    <th>Name</th><th>Email</th><th>Phone</th><th>Address</th>
  </tr>
  {% for user in users %}
  <tr>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.phone }}</td>
    <td>{{ user.address }}</td>
  </tr>
  {% endfor %}
</table>
