<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyze Product</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, rgba(63, 90, 116, 0.8), rgba(26, 188, 156, 0.8)),
        url('https://via.placeholder.com/1920x1080') no-repeat center center/cover;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .form-container {
      background: rgba(0, 0, 0, 0.7);
      padding: 30px;
      border-radius: 15px;
      max-width: 600px;
      width: 100%;
    }

    .btn-custom {
      margin-top: 15px;
      border-radius: 50px;
    }

    footer {
      background: #2c3e50;
      color: #bdc3c7;
      padding: 10px;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
    }

    footer a {
      color: #1abc9c;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    select.form-select {
      background-color: #0f1a24;
      color: #fff;
      border: 1px solid #00d4ff;
      border-radius: 10px;
      padding: 10px;
    }

    select.form-select:focus {
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
      border-color: #00ffd5;
    }

    option {
      background-color: #1e2a35;
      color: #fff;
    }

    #condition-description {
      font-size: 0.9rem;
      color: #00ffd5;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  {% include 'navbar.html' %}

  <div class="container mt-5">
    <div class="form-container text-center">
      <h2 class="mb-4">Analyze Product</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div
        class="alert alert-{{ 'info' if category=='info' else ('success' if category=='success' else 'danger') }} alert-dismissible fade show"
        role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data">

        <!-- Category -->
        <div class="mb-3 text-start">
          <label for="category" class="form-label">Category</label>
          <select class="form-select" id="category" name="category" onchange="updateSubcategories(this.value)" required>
  <option value="" disabled selected>-- Select Category --</option>
  <option value="Mobile & Accessories">Mobile & Accessories</option>
  <option value="Computers & Laptop">Computers & Laptop</option>
  <option value="Home Appliances">Home Appliances</option>
  <option value="Audio & Video">Audio & Video</option>
  <option value="Gaming">Gaming</option>
  <option value="Cameras & Drones">Cameras & Drones</option>
  <option value="Wearable Tech">Wearable Tech</option>
  <option value="Kitchen Appliances">Kitchen Appliances</option>
  <option value="Networking Devices">Networking Devices</option>
  <option value="Other Electronics">Other Electronics</option>
</select>
        </div>

        <!-- Subcategory -->
        <div class="mb-3 text-start">
          <label for="subcategory" class="form-label">Subcategory</label>
          <select class="form-select" id="subcategory" name="subcategory" required>
  <option value="" disabled selected>-- Select Subcategory --</option>
</select>
        </div>

        <!-- Product Type -->
        <div class="mb-3 text-start">
          <label for="product_type" class="form-label">Product Type</label>
          <select class="form-select" id="product_type" name="product_type" required>
  <option value="" disabled selected>-- Select Product Type --</option>
</select>
        </div>

        <!-- Brand -->
        <div class="mb-3 text-start">
          <label for="brand" class="form-label">Brand</label>
          <input type="text" class="form-control" id="brand" name="brand"
            placeholder="e.g. Dell, Apple, Samsung" required>
        </div>

        <!-- Year of Purchase -->
        <div class="mb-3 text-start">
          <label for="year_of_purchase" class="form-label">Year of Purchase</label>
          <input type="number" class="form-control" id="year_of_purchase" name="year_of_purchase" min="2000" max="2025"
            required>
        </div>

        <!-- Original Price -->
        <div class="mb-3 text-start">
          <label for="original_price" class="form-label">Original Price (INR)</label>
          <input type="number" class="form-control" id="original_price" name="original_price" min="1000" max="500000"
            required>
        </div>

        <!-- Overall Condition (Dropdown) -->
        <div class="mb-3 text-start">
          <label for="overall_condition" class="form-label">Overall Condition</label>
          <select name="overall_condition" id="overall_condition" class="form-select" required onchange="showConditionDesc()">
            <option value="">-- Select Overall Condition --</option>
            <option value="10">Brand New (10/10) - Unused, sealed condition</option>
            <option value="9">Like New (9/10) - Barely used, no signs of wear</option>
            <option value="8">Excellent (8/10) - Fully functional, minimal scratches</option>
            <option value="7">Very Good (7/10) - Light wear, no performance issues</option>
            <option value="6">Good (6/10) - Some visible wear, works perfectly</option>
            <option value="5">Fair (5/10) - Noticeable wear, minor functional issues</option>
            <option value="4">Used (4/10) - Visible damage, fully functional</option>
            <option value="3">Poor (3/10) - Major wear, may need minor repairs</option>
            <option value="2">Heavily Used (2/10) - Functional but in bad shape</option>
            <option value="1">Non-Functional (1/10) - Needs repair or for parts</option>
          </select>
          <div id="condition-description"></div>
        </div>

        <!-- Damage Condition -->
        <div class="mb-3 text-start">
          <label for="damage_condition" class="form-label">Damage Condition</label>
          <select class="form-select" id="damage_condition" name="damage_condition" required>
            <option value="" disabled selected>-- Select Damage Condition --</option>
            {% for condition in conditions %}
            <option value="{{ condition }}">{{ condition }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Location -->
        <div class="mb-3 text-start">
          <label for="location" class="form-label">Seller Location</label>
          <input type="text" class="form-control" id="location" name="location"
            placeholder="e.g. Chennai, Mumbai, Delhi" required>
        </div>

        <!-- Image Upload -->
        <div class="mb-3 text-start">
          <label for="image" class="form-label">Upload Product Image</label>
          <input type="file" class="form-control" id="image" name="image" accept="image/*">
        </div>

        <!-- Buttons -->
        <button type="submit" name="action" value="estimate" class="btn btn-primary btn-custom">Estimate Price</button>
        <button type="submit" name="action" value="add" class="btn btn-success btn-custom">Add Product</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary btn-custom">Back to Home</a>
      </form>
    </div>
  </div>

  <footer>
    &copy; 2025 Smart Circular Marketplace
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  // Define categories → subcategories → product types
  const dataMap = {
    "Mobile & Accessories": {
      "Smartphones": ["Android Phone", "iPhone", "5G Phone"],
      "Feature Phones": ["Basic Phone"],
      "Tablets": ["Android Tablet", "iPad"],
      "Smartwatches": ["WearOS Watch", "Apple Watch"],
      "Headphones": ["Wired", "Wireless", "Neckband", "Earbuds"],
      "Chargers & Cables": ["Type-C", "Lightning", "Micro USB"],
      "Power Banks": ["10,000 mAh", "20,000 mAh"],
      "Cases & Covers": ["Silicone", "Leather", "Hard Shell"]
    },

    "Computers & Laptop": {
      "Laptops": ["Gaming Laptop", "Business Laptop", "Student Laptop"],
      "Desktops": ["All-in-One", "Tower PC", "Mini PC"],
      "Monitors": ["Full HD", "4K", "Curved"],
      "Keyboards": ["Mechanical", "Wireless", "Gaming"],
      "Mice": ["Optical", "Wireless", "Gaming"],
      "Printers": ["Inkjet", "Laser", "All-in-One"],
      "External Hard Drives": ["HDD", "SSD"]
    },

    "Home Appliances": {
      "Refrigerators": ["Single Door", "Double Door", "Smart Fridge"],
      "Televisions": ["LED", "OLED", "QLED"],
      "Washing Machines": ["Front Load", "Top Load"],
      "Air Conditioners": ["Split AC", "Window AC", "Inverter AC"],
      "Vacuum Cleaners": ["Stick", "Robot", "Canister"]
    },

    "Audio & Video": {
      "Speakers": ["Bluetooth", "Smart", "Wired"],
      "Soundbars": ["Dolby Atmos", "Compact", "Wireless"],
      "Home Theaters": ["5.1", "7.1", "Sound System"],
      "Headphones": ["Over-Ear", "In-Ear", "ANC"],
      "Projectors": ["Mini Projector", "4K Projector"]
    },

    "Gaming": {
      "Consoles": ["PlayStation", "Xbox", "Nintendo Switch"],
      "Gaming Laptops": ["RTX Series", "AMD Radeon"],
      "Controllers": ["Wireless", "Wired"],
      "VR Headsets": ["Oculus", "PS VR"]
    },

    "Cameras & Drones": {
      "DSLR Cameras": ["Canon", "Nikon", "Sony"],
      "Mirrorless Cameras": ["Full Frame", "APS-C"],
      "Action Cameras": ["GoPro", "DJI Action"],
      "Camera Lenses": ["Prime", "Zoom"],
      "Drones": ["Mini Drone", "Professional Drone"]
    },

    "Wearable Tech": {
      "Smartwatches": ["Fitness Watch", "Smartwatch with GPS"],
      "Fitness Bands": ["Mi Band", "Fitbit", "Samsung Fit"],
      "VR Glasses": ["Oculus", "Meta Quest"]
    },

    "Kitchen Appliances": {
      "Microwaves": ["Convection", "Solo", "Grill"],
      "Toasters": ["2 Slice", "4 Slice"],
      "Coffee Makers": ["Espresso", "Drip", "Pod"],
      "Electric Kettles": ["Steel", "Glass"]
    },

    "Networking Devices": {
      "WiFi Routers": ["Dual Band", "Mesh"],
      "Modems": ["DSL", "Cable"],
      "Range Extenders": ["WiFi Booster", "Repeater"]
    },

    "Other Electronics": {
      "Smart Bulbs": ["RGB", "White"],
      "Adapters": ["USB-C Hub", "HDMI Adapter"],
      "Power Strips": ["4 Port", "6 Port"]
    }
  };

  // Update Subcategories
  function updateSubcategories(category) {
    const subcatSelect = document.getElementById("subcategory");
    const productTypeSelect = document.getElementById("product_type");

    subcatSelect.innerHTML = '<option value="" disabled selected>-- Select Subcategory --</option>';
    productTypeSelect.innerHTML = '<option value="" disabled selected>-- Select Product Type --</option>';

    if (dataMap[category]) {
      Object.keys(dataMap[category]).forEach(subcat => {
        subcatSelect.innerHTML += `<option value="${subcat}">${subcat}</option>`;
      });
    }
  }

  // Update Product Types
  function updateProductTypes(category, subcategory) {
    const productTypeSelect = document.getElementById("product_type");
    productTypeSelect.innerHTML = '<option value="" disabled selected>-- Select Product Type --</option>';

    if (dataMap[category] && dataMap[category][subcategory]) {
      dataMap[category][subcategory].forEach(type => {
        productTypeSelect.innerHTML += `<option value="${type}">${type}</option>`;
      });
    }
  }

  // Event listener for subcategory changes
  document.getElementById("subcategory").addEventListener("change", function () {
    const category = document.getElementById("category").value;
    const subcategory = this.value;
    updateProductTypes(category, subcategory);
  });

  // Optional: show condition description (unchanged)
  function showConditionDesc() {
    const descBox = document.getElementById("condition-description");
    const selected = document.getElementById("overall_condition");
    const text = selected.options[selected.selectedIndex].text;
    descBox.textContent = selected.value ? `Selected: ${text}` : "";
  }
</script>

</body>
</html>
