<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, rgba(63, 90, 116, 0.8), rgba(26, 188, 156, 0.8));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .payment-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            color: #fff;
        }
        .payment-container h2 {
            margin-bottom: 20px;
        }
        .btn-custom {
            border-radius: 50px;
        }
    </style>
</head>
<body>
<div class="payment-container">
    <h2>Complete Payment</h2>

    <p><strong>Product:</strong> {{ product['brand'] }} {{ product['product_type'] }}</p>
    <p><strong>Category:</strong> {{ product['category'] }} > {{ product['subcategory'] }}</p>
    <p><strong>Amount to Pay:</strong> ₹{{ amount }}</p>

    <form id="paymentForm" action="{{ url_for('payment') }}" method="POST" onsubmit="return validateForm()">
    <div class="mb-3">
        <label for="card_number" class="form-label">Card Number</label>
        <input type="text" class="form-control" id="card_number" name="card_number" 
               placeholder="1234 5678 9012 3456" maxlength="19" required>
        <small class="text-danger" id="cardError"></small>
    </div>

    <div class="mb-3">
        <label for="expiry" class="form-label">Expiry Date</label>
        <input type="text" class="form-control" id="expiry" name="expiry" 
               placeholder="MM/YY" maxlength="5" required>
        <small class="text-danger" id="expiryError"></small>
    </div>

    <div class="mb-3">
        <label for="cvv" class="form-label">CVV</label>
        <input type="password" class="form-control" id="cvv" name="cvv" 
               placeholder="123" maxlength="3" required>
        <small class="text-danger" id="cvvError"></small>
    </div>

    <button type="submit" class="btn btn-success btn-custom w-100">Pay ₹{{ amount }}</button>
</form>

<a href="{{ url_for('analyze') }}" class="btn btn-secondary btn-custom w-100 mt-3">Cancel</a>

<script>
function validateForm() {
    let valid = true;

    // Get field values
    const cardNumber = document.getElementById('card_number').value.replace(/\s+/g, '');
    const expiry = document.getElementById('expiry').value.trim();
    const cvv = document.getElementById('cvv').value.trim();

    // Error placeholders
    const cardError = document.getElementById('cardError');
    const expiryError = document.getElementById('expiryError');
    const cvvError = document.getElementById('cvvError');

    // Reset previous errors
    cardError.textContent = expiryError.textContent = cvvError.textContent = '';

    // ✅ Card validation
    if (!/^\d{16}$/.test(cardNumber)) {
        cardError.textContent = "Card number must be 16 digits.";
        valid = false;
    }

    // ✅ Expiry validation (MM/YY and not expired)
    if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) {
        expiryError.textContent = "Expiry must be in MM/YY format.";
        valid = false;
    } else {
        const [month, year] = expiry.split('/').map(x => parseInt(x, 10));
        const currentDate = new Date();
        const currentYear = parseInt(currentDate.getFullYear().toString().slice(-2));
        const currentMonth = currentDate.getMonth() + 1;
        if (year < currentYear || (year === currentYear && month < currentMonth)) {
            expiryError.textContent = "Card has expired.";
            valid = false;
        }
    }

    // ✅ CVV validation
    if (!/^\d{3}$/.test(cvv)) {
        cvvError.textContent = "CVV must be 3 digits.";
        valid = false;
    }

    return valid;
}
</script>
