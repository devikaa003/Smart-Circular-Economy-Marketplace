<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Circular Marketplace</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chatbot CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot/chatbot.css') }}">

    <!-- Optional custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>

    <style>
        body {
            padding-top: 70px;
        }

        main {
            flex: 1;
            padding: 20px;
        }

        footer {
            background-color: #2471A3;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 15px 15px 0 0;
        }

        /* Chatbot Floating Button */
        .chatbot-popup-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1ABC9C;
            color: white;
            padding: 15px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .chatbot-popup-button:hover {
            background: #16A085;
        }

        #chatbot-popup {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            max-height: 400px;
            background: white;
            border: 1px solid #ccc;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            z-index: 1000;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #eee;
            padding: 10px;
            height: 250px;
        }

        .user-message {
            text-align: right;
            background: #D1F2EB;
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
        }

        .bot-message {
            text-align: left;
            background: #F8F9F9;
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
        }

        #chat-form {
            display: flex;
            margin-top: 10px;
        }

        #user-input {
            flex-grow: 1;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        #chat-form button {
            padding: 5px 10px;
            margin-left: 5px;
            background: #1ABC9C;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .predefined-question {
            background: #eee;
            border: none;
            padding: 5px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Search bar */
        .search-form {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }

        .search-input {
            border-radius: 20px 0 0 20px;
            border: none;
            padding: 5px 10px;
            width: 180px;
            outline: none;
        }

        .search-btn {
            border-radius: 0 20px 20px 0;
            border: none;
            background: #1ABC9C;
            color: white;
            padding: 5px 12px;
        }

        .search-btn:hover {
            background: #16A085;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('homepage') }}">Smart Circular Marketplace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Left section: search bar -->
                <form class="search-form ms-auto me-3" action="{{ url_for('search') }}" method="GET">
                    <input type="text" name="query" class="search-input" placeholder="Search products..." required>
                    <button type="submit" class="search-btn">
                        <i class="fas fa-search"></i>
                    </button>
                </form>

                <!-- Right section: nav links -->
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('homepage') }}">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>

                    <!-- Categories Dropdown -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-th-large"></i> Categories
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="categoryDropdown">
                            <li><a class="dropdown-item" href="{{ url_for('category_view', category_name='Mobile & Accessories') }}">Mobile & Accessories</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('category_view', category_name='Computers & Laptop') }}">Computers & Laptop</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('category_view', category_name='Home Appliances') }}">Home Appliances</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-auto">
        <p>&copy; 2025 Smart Circular Marketplace</p>
    </footer>

    <!-- Chatbot Floating Button -->
    <div class="chatbot-popup-button" id="chatbot-toggle">💬</div>

    <!-- Chatbot Popup -->
    <div id="chatbot-popup">
        <div id="chat-box">
            <div class="bot-message">Hello! How can I assist you today? 🌱</div>
        </div>

        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Type your message..." required />
            <button type="submit">Send</button>
        </form>

        <div class="mt-2">
            <button class="predefined-question">Hello</button>
            <button class="predefined-question">How to buy a product</button>
            <button class="predefined-question">What is smart circular economy</button>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="{{ url_for('static', filename='chatbot/chatbot.js') }}"></script>
</body>
</html>
